<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Copilot Run</title>
  <style>
    :root { --blue:#0078d4; --bg:#f4f6f8; --card:#fff; --text:#242424; --muted:#5f6368; --line:#d9dee5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI",Arial,sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:32px 24px 60px; }
    h1 { margin:0; font-size:28px; }
    h2 { margin:0 0 10px; font-size:19px; }
    .subtitle { color:var(--muted); margin:5px 0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:18px; box-shadow:0 1px 2px #0000000d; }
    .status-row { display:flex; justify-content:space-between; gap:20px; margin-bottom:10px; }
    #statusText { font-weight:600; }
    #statusState { color:var(--muted); }
    .progress { height:10px; border-radius:10px; background:#e5e9ee; overflow:hidden; }
    #progressBar { height:100%; width:0; background:var(--blue); transition:width .25s ease; }
    .result { display:none; }
    textarea { width:100%; min-height:280px; resize:vertical; border:1px solid var(--line); border-radius:5px; padding:12px; font:13px/1.5 Consolas,monospace; }
    button { border:1px solid #b8d7f2; border-radius:5px; padding:8px 13px; background:#fff; color:var(--blue); font-weight:600; cursor:pointer; margin-top:8px; }
    button:hover { background:#f3f9fd; }
    .error { color:#a4262c; white-space:pre-wrap; }
    @media (max-width:700px) { main { padding:20px 14px; } .status-row { display:block; } }
  </style>
</head>
<body>
  <main>
    <h1>QA Copilot Run</h1>
    <p class="subtitle">Live progress and results for Feature Test Scope and Feature Bug Hunt.</p>

    <section class="card">
      <div class="status-row">
        <span id="statusText">Waiting for a run...</span>
        <span id="statusState">Ready</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <p id="errorText" class="error"></p>
    </section>

    <section id="resultPanel" class="result">
      <div class="card">
        <h2 id="firstHeading"></h2>
        <textarea id="firstOutput" readonly></textarea>
        <button id="copyFirst">Copy</button>
      </div>
      <div class="card">
        <h2 id="secondHeading"></h2>
        <textarea id="secondOutput" readonly></textarea>
        <button id="copySecond">Copy</button>
      </div>
    </section>
  </main>
  <script src="preview.js"></script>
</body>
</html>
